sonar.projectKey=skllr-backend
sonar.projectName=Skillr Backend
sonar.projectVersion=1.0

sonar.sources=.
sonar.inclusions=apps/**,libs/**

sonar.typescript.tsconfigPath=tsconfig.sonar.json
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,test/**
sonar.coverage.exclusions=**/*.spec.ts,test/**/*.ts,**/main.ts,**/*.module.ts,**/*.dto.ts,**/*.entity.ts

# 🔥 สำคัญ
sonar.javascript.lcov.reportPaths=coverage/lcov.info