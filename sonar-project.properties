sonar.projectKey=skllr-backend
sonar.projectName=Skillr Backend

sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# path ของ source code
sonar.sources=apps,libs
sonar.inclusions=apps/**/*.ts,libs/**/*.ts
sonar.tests=test
sonar.test.inclusions=apps/**/*.spec.ts,libs/**/*.spec.ts,test/**/*.ts

# ignore folder ที่ไม่ต้อง scan
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

sonar.coverage.exclusions=**/*.spec.ts,test/**/*.ts,**/main.ts,**/*.module.ts,**/*.dto.ts,**/*.entity.ts

# สำหรับ TypeScript
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# (optional) ถ้ามี test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info